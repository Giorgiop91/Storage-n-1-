<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@400;500;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F7EFE4; --terra:#C8553D; --sage:#7F9C8C; --navy:#2B2D42; --gold:#E3A94B; --pink:#E8B4A6; }
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--cream);}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--cream);font-family:Poppins,sans-serif;color:var(--navy);}
  svg{position:absolute;inset:0}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .serif{font-family:'Playfair Display',serif;}
  .hand{font-family:Caveat,cursive;}
</style>
</head>
<body>
<div id="stage">
  <svg id="bg" viewBox="0 0 1080 1920"></svg>
  <div id="txt" class="layer"></div>
  <svg id="fg" viewBox="0 0 1080 1920"></svg>
  <div id="cov" style="position:absolute;inset:0"><svg id="covg" viewBox="0 0 1080 1920"></svg><div id="covt" class="layer"></div></div>
</div>
<script>
const OFF = 1.6; // cover duration
const DUR = 16 + OFF; // seconds
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
// in/out envelope for a scene element
const env=(t,a,b,fi=.5,fo=.4)=>Math.min(easeOut(prog(t,a,a+fi)), 1-ease(prog(t,b-fo,b)));

function button(cx,cy,r,col,rot=0){
  const h=r*.22, o=r*.3;
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})">
   <circle r="${r}" fill="${col}"/><circle r="${r*.78}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="${r*.08}"/>
   ${[[-1,-1],[1,-1],[-1,1],[1,1]].map(([x,y])=>`<circle cx="${x*o}" cy="${y*o}" r="${h*.6}" fill="rgba(0,0,0,.25)"/>`).join('')}
  </g>`;
}
function spool(cx,cy,s,col,rot=0){
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${s})">
    <rect x="-70" y="-110" width="140" height="22" rx="8" fill="#B98A5E"/>
    <rect x="-70" y="88" width="140" height="22" rx="8" fill="#B98A5E"/>
    <rect x="-55" y="-88" width="110" height="176" fill="${col}"/>
    ${Array.from({length:11},(_,i)=>`<line x1="-55" x2="55" y1="${-80+i*16}" y2="${-76+i*16}" stroke="rgba(0,0,0,.13)" stroke-width="4"/>`).join('')}
  </g>`;
}
function scissors(cx,cy,s,rot,open){
  const a=open*18;
  return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${s})" fill="none" stroke="${'#2B2D42'}" stroke-width="10" stroke-linecap="round">
    <g transform="rotate(${-a})"><path d="M0 0 L190 -12" stroke-width="14"/><circle cx="-60" cy="22" r="32"/></g>
    <g transform="rotate(${a})"><path d="M0 0 L190 12" stroke-width="14"/><circle cx="-60" cy="-22" r="32"/></g>
    <circle r="7" fill="#2B2D42"/>
  </g>`;
}
// dashed stitch path that "draws" itself
function stitch(d,p,col,w=8,len=3000){
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"
    stroke-dasharray="28 22" style="mask:none" pathLength="${len}"
    stroke-dashoffset="0" clip-path="none" opacity="1" data-p="${p}"/>`;
}
// we emulate progressive draw with a mask path
let maskId=0;
function drawn(d,p,col,w=8){
  const id='m'+(maskId++);
  return `<defs><mask id="${id}" maskUnits="userSpaceOnUse"><path d="${d}" fill="none" stroke="#fff" stroke-width="${w+14}" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="${1000*(1-p)}" stroke-linecap="round"/></mask></defs>
  <path d="${d}" mask="url(#${id})" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="30 20"/>`;
}

function render(T0){
  maskId=0;
  const t=T0-OFF;
  const bg=document.getElementById('bg'), fg=document.getElementById('fg'), txt=document.getElementById('txt');
  let B='', F='', T='';

  // ---- persistent background: soft fabric dots + slow wave
  B+=`<defs><pattern id="dots" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="translate(${t*12} ${t*8})"><circle cx="10" cy="10" r="4" fill="#E9DCCB"/></pattern></defs>
      <rect width="1080" height="1920" fill="url(#dots)"/>`;
  // corner blobs
  const wob=Math.sin(t*1.3)*20;
  B+=`<circle cx="${980+wob}" cy="${180}" r="${260}" fill="var(--pink)" opacity=".55"/>`;
  B+=`<circle cx="${80-wob}" cy="${1780}" r="${300}" fill="var(--sage)" opacity=".35"/>`;

  // ================= SCENE 1 (0 - 3.4): hook
  {
    const e=env(t,0,3.4,.6,.45);
    if(e>0){
      const p=ease(prog(t,0.1,2.2));
      const d="M -40 760 C 200 640, 380 900, 560 780 S 900 640, 1120 760";
      B+=`<g opacity="${e}">${drawn(d,p,'var(--terra)',9)}</g>`;
      // needle travelling on the path
      const d2="M -40 1260 C 220 1380, 420 1140, 620 1260 S 920 1380, 1120 1250";
      B+=`<g opacity="${e}">${drawn(d2,ease(prog(t,0.4,2.6)),'var(--sage)',9)}</g>`;
      const y=(1-e)*60;
      T+=`<div style="position:absolute;top:880px;left:0;right:0;transform:translateY(${y}px);opacity:${e}">
            <div class="hand" style="font-size:78px;color:var(--terra);margin-bottom:6px">Hai sempre sognato</div>
            <div class="serif" style="font-size:96px;font-weight:900;line-height:1.05">di creare i tuoi<br><i style="color:var(--terra)">abiti?</i></div>
          </div>`;
      F+=`<g opacity="${e}">${button(200,520+Math.sin(t*2)*14,62,'var(--gold)',t*40)}${button(880,1480+Math.cos(t*2)*14,48,'var(--terra)',-t*50)}</g>`;
    }
  }

  // ================= SCENE 2 (3.2 - 7.2): title reveal
  {
    const e=env(t,3.2,7.2,.5,.45);
    if(e>0){
      const s=back(prog(t,3.25,3.95));
      const s2=back(prog(t,3.6,4.3));
      // fabric swatch card
      B+=`<g transform="translate(540 960) rotate(${-4+ (1-s)*-10}) scale(${0.6+0.4*s})" opacity="${e}">
            <rect x="-430" y="-400" width="860" height="800" rx="40" fill="var(--terra)"/>
            <rect x="-400" y="-370" width="800" height="740" rx="28" fill="none" stroke="var(--cream)" stroke-width="7" stroke-dasharray="26 18"/>
          </g>`;
      const ty=(1-easeOut(prog(t,3.5,4.2)))*40;
      T+=`<div style="position:absolute;top:640px;left:0;right:0;opacity:${e};color:var(--cream);transform:translateY(${ty}px)">
            <div style="font-size:42px;letter-spacing:14px;font-weight:600;opacity:.9">NUOVO</div>
            <div class="serif" style="font-size:156px;font-weight:900;line-height:.98;margin-top:14px">Corso di<br>Sartoria</div>
          </div>`;
      // label strip "Lab Creativo"
      T+=`<div style="position:absolute;top:1300px;left:0;right:0;display:flex;justify-content:center;opacity:${e}">
            <div style="background:var(--navy);color:var(--cream);padding:22px 56px;border-radius:999px;font-size:54px;font-weight:600;transform:scale(${s2}) rotate(2deg)">
              ✂ Lab Creativo
            </div></div>`;
      F+=`<g opacity="${e}">${spool(890,520,1.05*s,'var(--sage)',12)}${scissors(150,1560,1.1*s, -25, (Math.sin(t*9)+1)/2)}</g>`;
    }
  }

  // ================= SCENE 3 (7.0 - 11.6): what you learn
  {
    const e=env(t,7.0,11.6,.5,.45);
    if(e>0){
      const items=[
        ['🧵','Usare la macchina da cucire'],
        ['📐','Cartamodelli e taglio'],
        ['🪡','Orli, cerniere e bottoni'],
        ['👗','Il tuo primo capo, fatto da te'],
      ];
      const hy=(1-easeOut(prog(t,7.0,7.6)))*40;
      T+=`<div style="position:absolute;top:330px;left:0;right:0;opacity:${e};transform:translateY(${hy}px)">
            <div class="hand" style="font-size:80px;color:var(--terra)">Cosa imparerai</div>
            <div class="serif" style="font-size:92px;font-weight:900;line-height:1">passo dopo passo</div>
          </div>`;
      items.forEach((it,i)=>{
        const a=7.5+i*0.55;
        const pe=easeOut(prog(t,a,a+.5))*e;
        const x=(1-easeOut(prog(t,a,a+.55)))*-120;
        T+=`<div style="position:absolute;left:110px;right:110px;top:${720+i*215}px;opacity:${pe};transform:translateX(${x}px);
               display:flex;align-items:center;gap:34px;background:#fff;border-radius:34px;padding:34px 40px;box-shadow:0 14px 0 ${i%2?'var(--sage)':'var(--pink)'};">
              <div style="font-size:72px;width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--cream);border-radius:50%">${it[0]}</div>
              <div style="font-size:46px;font-weight:600;text-align:left;line-height:1.15">${it[1]}</div>
            </div>`;
      });
      // vertical stitched seam on left
      B+=`<g opacity="${e}">${drawn('M 60 700 L 60 1620',ease(prog(t,7.3,10)),'var(--terra)',8)}</g>`;
    }
  }

  // ================= SCENE 4 (11.4 - 16): CTA
  {
    const e=Math.min(easeOut(prog(t,11.4,12.0)),1);
    if(e>0){
      const pulse=1+Math.sin(t*6)*.035;
      const tags=['Anche se parti da zero','Piccoli gruppi','Atmosfera creativa'];
      T+=`<div style="position:absolute;top:360px;left:0;right:0;opacity:${e};transform:translateY(${(1-e)*50}px)">
            <div class="serif" style="font-size:118px;font-weight:900;line-height:1">Iscrizioni<br><i style="color:var(--terra)">aperte!</i></div>
          </div>`;
      tags.forEach((tg,i)=>{
        const a=12.0+i*.3, pe=back(prog(t,a,a+.5));
        T+=`<div style="position:absolute;top:${800+i*130}px;left:0;right:0;display:flex;justify-content:center">
              <div style="transform:scale(${pe});opacity:${clamp(pe)};border:5px dashed var(--navy);border-radius:999px;padding:18px 48px;font-size:44px;font-weight:500;background:rgba(255,255,255,.6)">✔ ${tg}</div></div>`;
      });
      const cb=back(prog(t,13.0,13.6));
      T+=`<div style="position:absolute;top:1290px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:30px">
            <div style="transform:scale(${cb*pulse});opacity:${clamp(cb)};background:var(--terra);color:#fff;font-size:60px;font-weight:600;padding:34px 80px;border-radius:999px;box-shadow:0 12px 0 #8E3A28">
              Prenota il tuo posto 👉</div>
            <div style="opacity:${easeOut(prog(t,13.5,14.1))};font-size:44px;font-weight:500">Link in bio · Scrivici in DM</div>
            <div style="opacity:${easeOut(prog(t,13.8,14.4))};font-size:40px;color:var(--terra);font-weight:600;letter-spacing:6px">POSTI LIMITATI</div>
          </div>`;
      T+=`<div style="position:absolute;bottom:150px;left:0;right:0;opacity:${easeOut(prog(t,14,14.6))}">
            <div class="hand" style="font-size:72px">✂ Lab Creativo</div></div>`;
      F+=`<g opacity="${e}">${button(150,300+Math.sin(t*2)*12,55,'var(--gold)',t*40)}${button(960,1060+Math.cos(t*2.3)*12,42,'var(--sage)',-t*60)}${button(130,1150,34,'var(--terra)',t*30)}</g>`;
    }
  }

  // ================= COVER (0 - OFF): copertina / anteprima
  let CG='',CT='';
  {
    const c=1-ease(prog(T0,OFF-0.45,OFF+0.05));
    if(c>0){
      const sw=Math.sin(T0*2);
      CG+=`<g opacity="${c}">
        <rect width="1080" height="1920" fill="var(--terra)"/>
        <defs><pattern id="weave" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 12h24M12 0v24" stroke="rgba(255,255,255,.06)" stroke-width="3"/></pattern></defs>
        <rect width="1080" height="1920" fill="url(#weave)"/>
        <circle cx="1010" cy="250" r="330" fill="var(--pink)" opacity=".35"/>
        <circle cx="40" cy="1700" r="360" fill="var(--navy)" opacity=".18"/>
        <rect x="70" y="290" width="940" height="1340" rx="46" fill="none" stroke="var(--cream)" stroke-width="7" stroke-dasharray="30 20"/>
        <!-- metro da sarta -->
        <g transform="translate(-40 1440) rotate(-8)">
          <rect width="1200" height="90" fill="var(--gold)"/>
          ${Array.from({length:60},(_,i)=>`<line x1="${i*20}" x2="${i*20}" y1="0" y2="${i%5?22:42}" stroke="var(--navy)" stroke-width="4"/>`).join('')}
          ${Array.from({length:12},(_,i)=>`<text x="${i*100+6}" y="78" font-family="Poppins" font-weight="600" font-size="26" fill="var(--navy)">${i+10}</text>`).join('')}
        </g>
        ${spool(860,470,1.25,'var(--sage)',14)}
        ${scissors(600,1650,1.1,-15,0.5)}
        ${button(200,430+sw*6,64,'var(--gold)',20)}${button(910,1210,52,'var(--cream)',-15)}${button(170,1100,36,'var(--navy)',10)}
      </g>`;
      CT+=`<div style="position:absolute;inset:0;opacity:${c}">
        <div style="position:absolute;top:560px;left:0;right:0;text-align:center;color:var(--cream)">
          <div style="font-size:42px;letter-spacing:16px;font-weight:600">NUOVO</div>
          <div class="serif" style="font-size:120px;font-weight:900;line-height:1;margin-top:10px;font-style:italic">Corso di</div>
          <div class="serif" style="font-size:190px;font-weight:900;line-height:.92">Sartoria</div>
          <div class="hand" style="font-size:92px;margin-top:18px;color:var(--navy)">✂ Lab Creativo</div>
        </div>
        <div style="position:absolute;top:1190px;left:0;right:0;display:flex;justify-content:center">
          <div style="background:var(--cream);color:var(--terra);font-size:50px;font-weight:600;padding:22px 60px;border-radius:999px;transform:rotate(-3deg) scale(${1+Math.sin(T0*6)*.03});box-shadow:0 10px 0 var(--navy)">Iscrizioni aperte</div>
        </div></div>`;
    }
  }

    document.getElementById('covg').innerHTML=CG; document.getElementById('covt').innerHTML=CT;
  document.getElementById('cov').style.display=CG?'block':'none';

  // progress thread at top (Reels style)
  F+=`<line x1="60" y1="70" x2="${60+960*(T0/DUR)}" y2="70" stroke="var(--terra)" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 10" opacity=".7"/>`;

  bg.innerHTML=B; fg.innerHTML=F; txt.innerHTML=T;
}
window.render=render;
const q=new URLSearchParams(location.search);
if(!q.has('capture')){ const s=performance.now(); (function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})(); }
else render(0);
</script>
</body>
</html>
